spring.application.name=SharpWallet
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sharpwallet}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-circular-references=true
spring.datasource.hikari.maximum-pool-size=10
server.port=${PORT:9060}
PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:}
PAYSTACK_INITIALIZE_TRANSACTION=${PAYSTACK_INITIALIZE_TRANSACTION:https://api.paystack.co/transaction/initialize}
MONNIFY_CONTRACT_CODE=${MONNIFY_CONTRACT_CODE:}
MONNIFY_SECRET_KEY=${MONNIFY_SECRET_KEY:}
MONNIFY_API_KEY=${MONNIFY_API_KEY:}
MONNIFY_INIT_URL=${MONNIFY_INIT_URL:https://sandbox.monnify.com/api/v1/merchant/transactions/init-transaction}
